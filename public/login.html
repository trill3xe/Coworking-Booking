<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WORKSPACE | Вход</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="login">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="tab-btn active" type="button" data-auth-tab="login">Вход</button>
          <button class="tab-btn" type="button" data-auth-tab="register">Регистрация</button>
        </div>

        <form data-login-form>
          <div class="form-grid">
            <label>
              <span class="muted">Email</span>
              <input class="input" name="email" type="email" placeholder="you@example.com" required />
            </label>
            <label>
              <span class="muted">Пароль</span>
              <input class="input" name="password" type="password" placeholder="demo123" required />
            </label>
            <button class="btn secondary" type="button" data-password-reset aria-controls="password-reset-message">
              Забыли пароль?
            </button>
            <p class="muted" id="password-reset-message" data-password-reset-message role="status" aria-live="polite" hidden></p>
            <button class="btn primary" type="submit">Войти</button>
          </div>
        </form>

        <form data-register-form class="hidden">
          <div class="form-grid">
            <label>
              <span class="muted">Имя</span>
              <input class="input" name="name" type="text" placeholder="Ваше имя" required />
            </label>
            <label>
              <span class="muted">Email</span>
              <input class="input" name="email" type="email" placeholder="you@example.com" required />
            </label>
            <label>
              <span class="muted">Пароль</span>
              <input class="input" name="password" type="password" placeholder="Введите пароль" required />
            </label>
            <button class="btn primary" type="submit">Создать аккаунт</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
